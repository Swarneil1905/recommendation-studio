name: recommendation-studio
services:
  web:
    build: ./frontend
    ports: ["127.0.0.1:8082:8080"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build: ./api
    environment:
      RANKER_URL: http://ranker:8090
      BIND_ADDRESS: 0.0.0.0
    depends_on: [ranker]
    restart: unless-stopped
  ranker:
    build: ./ranker
    restart: unless-stopped

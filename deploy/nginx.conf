worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/nginx-body;
 proxy_temp_path /tmp/nginx-proxy;
 fastcgi_temp_path /tmp/nginx-fastcgi;
 uwsgi_temp_path /tmp/nginx-uwsgi;
 scgi_temp_path /tmp/nginx-scgi;
 map $http_x_real_ip $client_ip { default $remote_addr; ~^[0-9a-fA-F:.]+$ $http_x_real_ip; }
 limit_req_zone $client_ip zone=per_client:1m rate=2r/s;
 limit_req_zone $server_name zone=shared:1m rate=20r/s;
 limit_conn_zone $server_name zone=connections:1m;
 limit_req_status 429;
 limit_conn_status 429;
 server {
  listen 8080;
  root /app/public;
  client_max_body_size 11m;
  client_body_buffer_size 11m;
  client_body_timeout 15s;
  client_header_timeout 10s;
  send_timeout 20s;
  keepalive_timeout 30s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  error_page 429 = @limited;
  error_page 413 = @large;
  location @limited { default_type application/json; add_header Retry-After 60 always; return 429 '{"error":"The public demo is busy. Please wait a minute and retry."}'; }
  location @large { default_type application/json; return 413 '{"error":"Upload one image smaller than 10 MB."}'; }
  location = /healthz {
   proxy_pass http://127.0.0.1:8002/api/health;
   proxy_set_header Host localhost;
   proxy_connect_timeout 2s;
   proxy_read_timeout 5s;
  }
  location /api/ {
   limit_req zone=per_client burst=12 nodelay;
   limit_req zone=shared burst=30 nodelay;
   limit_conn connections 6;
   proxy_pass http://127.0.0.1:8002;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto PUBLIC_SCHEME;
   proxy_set_header X-Client-IP $client_ip;
   proxy_set_header X-Forwarded-For "";
   proxy_set_header Authorization "";
   proxy_connect_timeout 3s;
   proxy_read_timeout 40s;
   proxy_request_buffering off;
   proxy_buffering off;
  }
  location ~ /\. { deny all; }
  location ~* \.(js|css)$ { try_files $uri =404; expires 1y; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
 }
}
